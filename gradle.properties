pluginGroup = com.github.siropkin.budijetbrains
pluginName = budi
pluginRepositoryUrl = https://github.com/siropkin/budi-jetbrains
pluginVersion = 0.1.0

# IntelliJ Platform compatibility floor.
# 242 = 2024.2 — keeps K2-era Kotlin and modern coroutines available
# while staying broad enough for most JetBrains IDE installs in 2026.
# pluginUntilBuild left blank so verifier proves compatibility upward.
pluginSinceBuild = 242
pluginUntilBuild =

# IntelliJ Platform Gradle Plugin — target IDE for the build.
# IC = IntelliJ IDEA Community. The widget-only plugin we ship has no
# IC-vs-IU divergent code paths, so building against IC keeps the
# verifier matrix simpler and the test runIde faster.
platformType = IC
platformVersion = 2024.2

# Java/Gradle toolchain.
javaVersion = 21
gradleVersion = 8.10

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
