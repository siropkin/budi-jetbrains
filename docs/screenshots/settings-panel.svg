<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <style>
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace; }
    </style>
    <clipPath id="dialog-clip">
      <rect width="1200" height="760" rx="10"/>
    </clipPath>
  </defs>

  <!-- Dimmed background (IDE behind the dialog) -->
  <rect width="1200" height="760" fill="#888" opacity="0.15" rx="10"/>

  <!-- Settings dialog -->
  <rect x="80" y="30" width="1040" height="700" rx="10" fill="#F7F8FA" stroke="#C0C0C0" stroke-width="1"/>

  <!-- Dialog title bar -->
  <rect x="80" y="30" width="1040" height="40" rx="10" fill="#E8E8E8"/>
  <rect x="80" y="60" width="1040" height="10" fill="#E8E8E8"/>
  <rect x="80" y="70" width="1040" height="1" fill="#D0D0D0"/>
  <!-- Traffic lights -->
  <circle cx="100" cy="50" r="6" fill="#FF5F57"/>
  <circle cx="120" cy="50" r="6" fill="#FFBD2E"/>
  <circle cx="140" cy="50" r="6" fill="#28C840"/>
  <text x="600" y="55" text-anchor="middle" font-size="13" fill="#333" font-weight="500">Settings</text>

  <!-- Search bar -->
  <rect x="100" y="80" width="1000" height="30" rx="6" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="116" y="100" font-size="12" fill="#999">🔍  Search settings…</text>

  <!-- Left sidebar -->
  <rect x="80" y="120" width="260" height="560" fill="#F0F0F2"/>
  <rect x="340" y="120" width="1" height="560" fill="#D0D0D0"/>

  <!-- Sidebar items -->
  <text x="100" y="148" font-size="13" fill="#555">Appearance &amp; Behavior</text>
  <text x="100" y="174" font-size="13" fill="#555">Keymap</text>
  <text x="100" y="200" font-size="13" fill="#555">Editor</text>
  <text x="100" y="226" font-size="13" fill="#555">Plugins</text>
  <text x="100" y="252" font-size="13" fill="#555">Version Control</text>
  <text x="100" y="278" font-size="13" fill="#555">Build, Execution, Deployment</text>
  <text x="100" y="304" font-size="13" fill="#555">Languages &amp; Frameworks</text>

  <!-- Tools section (expanded) -->
  <text x="100" y="334" font-size="13" fill="#333" font-weight="600">▾ Tools</text>
  <text x="116" y="358" font-size="13" fill="#555">Actions on Save</text>
  <text x="116" y="382" font-size="13" fill="#555">Terminal</text>

  <!-- BUDI selected -->
  <rect x="80" y="391" width="260" height="26" rx="0" fill="#3574F0"/>
  <text x="116" y="409" font-size="13" fill="white" font-weight="500">budi</text>

  <text x="116" y="436" font-size="13" fill="#555">External Tools</text>
  <text x="116" y="460" font-size="13" fill="#555">SSH Configurations</text>

  <!-- Right pane — budi settings -->
  <rect x="341" y="120" width="779" height="560" fill="#FFFFFF"/>

  <!-- Settings header -->
  <text x="370" y="156" font-size="16" fill="#333" font-weight="600">budi</text>

  <!-- Description comment -->
  <text x="370" y="185" font-size="12" fill="#888">Status bar renders the daemon's surface=jetbrains rollup. v0.1 tracks GitHub Copilot for</text>
  <text x="370" y="201" font-size="12" fill="#888">JetBrains; JetBrains AI Assistant is planned for v0.2 —</text>
  <text x="714" y="201" font-size="12" fill="#3574F0"> see #32</text>
  <text x="768" y="201" font-size="12" fill="#888">.</text>

  <!-- Daemon URL field -->
  <text x="370" y="240" font-size="13" fill="#333" font-weight="500">Daemon URL:</text>
  <rect x="510" y="224" width="360" height="28" rx="4" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="520" y="243" class="mono" font-size="12" fill="#333">http://127.0.0.1:7878</text>
  <text x="510" y="268" font-size="11" fill="#888">Loopback only — 127.0.0.1, localhost, or [::1].</text>

  <!-- Cloud endpoint field -->
  <text x="370" y="302" font-size="13" fill="#333" font-weight="500">Cloud endpoint:</text>
  <rect x="510" y="286" width="360" height="28" rx="4" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="520" y="305" class="mono" font-size="12" fill="#333">https://app.getbudi.dev</text>
  <text x="510" y="330" font-size="11" fill="#888">https on getbudi.dev (or a subdomain).</text>

  <!-- Polling interval field -->
  <text x="370" y="364" font-size="13" fill="#333" font-weight="500">Polling interval (ms):</text>
  <rect x="551" y="348" width="80" height="28" rx="4" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="561" y="367" class="mono" font-size="12" fill="#333">15000</text>
  <text x="551" y="392" font-size="11" fill="#888">How often to refresh the status bar. Minimum 3s.</text>

  <!-- Include other surfaces checkbox (unchecked) -->
  <rect x="370" y="414" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/>
  <text x="395" y="427" font-size="13" fill="#333">Include other surfaces (drop the ?surface=jetbrains filter)</text>
  <text x="395" y="448" font-size="11" fill="#888">When checked, the status bar shows your aggregate spend across every editor host.</text>

  <!-- Suppress update notification checkbox (unchecked) -->
  <rect x="370" y="468" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/>
  <text x="395" y="481" font-size="13" fill="#333">Suppress "daemon needs an update" notification</text>
  <text x="395" y="502" font-size="11" fill="#888">When checked, the upgrade prompt is silenced for the current stale-version episode.</text>

  <!-- Detected sources -->
  <text x="370" y="540" font-size="13" fill="#333" font-weight="500">Detected sources:</text>
  <text x="510" y="540" class="mono" font-size="11" fill="#555">~/.copilot/logs/jetbrains/agent.log</text>
  <text x="510" y="558" font-size="11" fill="#888">Filesystem paths the daemon is tailing for surface=jetbrains.</text>

  <!-- Bottom buttons -->
  <rect x="80" y="680" width="1040" height="50" rx="0" fill="#F0F0F2"/>
  <rect x="80" y="680" width="1040" height="1" fill="#D0D0D0"/>
  <!-- Bottom rounded corners -->
  <rect x="80" y="710" width="1040" height="20" rx="10" fill="#F0F0F2"/>

  <!-- OK button -->
  <rect x="858" y="694" width="70" height="28" rx="6" fill="#3574F0"/>
  <text x="893" y="713" text-anchor="middle" font-size="13" fill="white" font-weight="500">OK</text>

  <!-- Cancel button -->
  <rect x="938" y="694" width="80" height="28" rx="6" fill="#E4E4E6" stroke="#C0C0C0" stroke-width="1"/>
  <text x="978" y="713" text-anchor="middle" font-size="13" fill="#333">Cancel</text>

  <!-- Apply button -->
  <rect x="1028" y="694" width="72" height="28" rx="6" fill="#E4E4E6" stroke="#C0C0C0" stroke-width="1"/>
  <text x="1064" y="713" text-anchor="middle" font-size="13" fill="#333">Apply</text>
</svg>
