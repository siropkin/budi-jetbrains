<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <style>
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace; }
    </style>
    <clipPath id="window-clip">
      <rect width="1200" height="760" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" rx="10" fill="#F7F8FA" clip-path="url(#window-clip)"/>

  <!-- macOS Title Bar -->
  <rect width="1200" height="40" fill="#E8E8E8" clip-path="url(#window-clip)"/>
  <rect x="0" y="40" width="1200" height="1" fill="#D0D0D0"/>
  <circle cx="20" cy="20" r="6" fill="#FF5F57"/>
  <circle cx="40" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="20" r="6" fill="#28C840"/>
  <text x="600" y="25" text-anchor="middle" font-size="13" fill="#333" font-weight="500">Welcome – budi-jetbrains – IntelliJ IDEA</text>

  <!-- Toolbar -->
  <rect x="0" y="41" width="1200" height="36" fill="#F0F0F2"/>
  <rect x="0" y="77" width="1200" height="1" fill="#D0D0D0"/>
  <rect x="12" y="49" width="20" height="20" rx="4" fill="#DCDCDC"/>
  <rect x="38" y="49" width="20" height="20" rx="4" fill="#DCDCDC"/>
  <rect x="64" y="49" width="20" height="20" rx="4" fill="#DCDCDC"/>
  <rect x="110" y="49" width="60" height="20" rx="4" fill="#5FAD65"/>
  <text x="140" y="63" text-anchor="middle" font-size="11" fill="white" font-weight="500">▶ Run</text>
  <rect x="400" y="49" width="400" height="20" rx="10" fill="#E4E4E6"/>
  <text x="600" y="63" text-anchor="middle" font-size="11" fill="#999">Search Everywhere    Double ⇧</text>

  <!-- Editor Tabs -->
  <rect x="0" y="78" width="1200" height="32" fill="#E8E8EA"/>
  <rect x="0" y="110" width="1200" height="1" fill="#D0D0D0"/>
  <rect x="0" y="78" width="120" height="32" fill="#FFFFFF"/>
  <rect x="0" y="108" width="120" height="2" fill="#3574F0"/>
  <text x="16" y="99" font-size="12" fill="#333" font-weight="500">Welcome</text>

  <!-- Editor area (Welcome tab) -->
  <rect x="0" y="111" width="1200" height="618" fill="#FFFFFF"/>

  <!-- Welcome content -->
  <text x="600" y="300" text-anchor="middle" font-size="28" fill="#333" font-weight="600">IntelliJ IDEA</text>
  <text x="600" y="330" text-anchor="middle" font-size="14" fill="#888">2024.2.3</text>

  <text x="420" y="380" font-size="14" fill="#3574F0">New Project</text>
  <text x="420" y="410" font-size="14" fill="#3574F0">Open</text>
  <text x="420" y="440" font-size="14" fill="#3574F0">Get from VCS</text>

  <text x="650" y="380" font-size="13" fill="#888" font-weight="500">Recent Projects</text>
  <text x="650" y="408" font-size="13" fill="#333">budi-jetbrains</text>
  <text x="650" y="426" font-size="11" fill="#999">~/_projects/budi-jetbrains</text>
  <text x="650" y="454" font-size="13" fill="#333">my-kotlin-app</text>
  <text x="650" y="472" font-size="11" fill="#999">~/_projects/my-kotlin-app</text>

  <!-- STATUS BAR -->
  <rect x="0" y="729" width="1200" height="31" fill="#F0F0F2" clip-path="url(#window-clip)"/>
  <rect x="0" y="728" width="1200" height="1" fill="#D0D0D0"/>

  <text x="12" y="749" font-size="11" fill="#888">main</text>
  <text x="50" y="749" font-size="11" fill="#CCC">|</text>
  <text x="62" y="749" font-size="11" fill="#888">LF</text>
  <text x="82" y="749" font-size="11" fill="#CCC">|</text>
  <text x="94" y="749" font-size="11" fill="#888">UTF-8</text>

  <!-- BUDI widget showing "setup" state -->
  <circle cx="1070" cy="744" r="5" fill="#2563EB"/>
  <text x="1082" y="749" font-size="12" fill="#333" font-weight="500">budi</text>
  <text x="1110" y="749" font-size="12" fill="#999"> · </text>
  <text x="1123" y="749" font-size="12" fill="#E07000" font-weight="500">setup</text>

  <!-- Notification balloon (sticky) -->
  <g>
    <!-- Balloon shadow -->
    <rect x="718" y="533" width="454" height="164" rx="10" fill="#000" opacity="0.08"/>

    <!-- Balloon body -->
    <rect x="716" y="530" width="454" height="164" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>

    <!-- Info icon -->
    <circle cx="742" cy="562" r="10" fill="#3574F0"/>
    <text x="742" y="567" text-anchor="middle" font-size="14" fill="white" font-weight="600">i</text>

    <!-- Notification title -->
    <text x="762" y="558" font-size="14" fill="#333" font-weight="600">budi is not installed on this machine yet</text>

    <!-- Close button -->
    <text x="1150" y="556" font-size="16" fill="#999" text-anchor="middle">×</text>

    <!-- Notification body -->
    <text x="762" y="584" font-size="12" fill="#555">Click </text>
    <text x="786" y="584" font-size="12" fill="#333" font-weight="600">Show install command</text>
    <text x="940" y="584" font-size="12" fill="#555"> to see the one-liner</text>
    <text x="762" y="602" font-size="12" fill="#555">you need to run in a terminal.</text>

    <!-- Action buttons -->
    <rect x="762" y="625" width="170" height="28" rx="6" fill="#3574F0"/>
    <text x="847" y="644" text-anchor="middle" font-size="12" fill="white" font-weight="500">Show install command</text>

    <rect x="944" y="625" width="80" height="28" rx="6" fill="#E4E4E6" stroke="#C0C0C0" stroke-width="1"/>
    <text x="984" y="644" text-anchor="middle" font-size="12" fill="#555">Dismiss</text>

    <!-- Timestamp -->
    <text x="762" y="676" font-size="10" fill="#AAA">just now</text>
  </g>
</svg>
